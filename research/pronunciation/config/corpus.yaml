# Corpus contract for the pronunciation reference dataset. Read by scripts/common.py and check_dataset.py.
corpus_id: lumad_lingua_pronunciation
expected_reference_recordings: 128        # physical, researcher-validated reference recordings (established project data, 2026-09-30)
reference_speaker_id: R001
reference_validation:
  status: validated
  validator_code: V01
  provenance: >
    Every recording in the Supabase export of project ovdwgowtnlujnbcyldkk, bucket audio, path dataset
    (archive dataset.zip, sha256 df4e62cadd972f04a614b3ccc1f634f18b0a6269803b22c913d4f32fea218d89, 128 entries)
    is a researcher-validated reference recording. Validation status is independent of vocabulary mapping status.
recording_id_scheme: REF_nnn, assigned once by ascending byte-wise sort of the original object_name at first registration; never reassigned or reused
vocabulary_item_id_scheme: Wnnn, assigned only when a recording-to-item mapping is supported by evidence; an item may own several reference recordings
multiple_references_per_item: true
mapping_status_values: [mapped, unresolved]
mapping_evidence_values: [firestore_exact_term, validator_confirmed, researcher_confirmed]
learner_recording_id_scheme: Sxxx_Wnnn[_Tnn]; learner collection requires the item list (mapping) to be complete first

# ---- learner collection and human ground truth (stage prepared 2026-10-02; no learner data exists yet) ----
learner_collection:
  protocol_version: LC1.1
  participant_id_scheme: "Sxxx (S001, S002, ...): code only; no name, school, sex, age, municipality or ethnicity is encoded anywhere in the dataset"
  recording_id_scheme: "Sxxx_Wnnn = the single primary attempt; Sxxx_Wnnn_Tnn (nn >= 02) = retake after a documented technical failure of take nn-1; earlier takes are never overwritten or deleted"
  target_list: metadata/learner_targets.csv          # generated from vocabulary.csv + reference_recordings.csv by scripts/build_learner_targets.py; never hand-edited
  items_per_learner: all_targets                      # every learner attempts every collection-eligible item (112 at v0.2)
  minimum_learners: 10
  accepted_formats:
    lossless_preferred: [wav, flac]
    device_formats_preserved_as_is: [m4a, aac, mp4, 3gp, ogg, opus, mp3, amr]
  primary_playback_reference_policy: lowest_reference_id   # deterministic: smallest REF_nnn among the item's validated references, recorded per item in learner_targets.csv; chosen without any learner or algorithm information; every validated reference stays available for later algorithm scoring
human_rating:
  protocol_version: RP1.1
  scale: integers 1-5 (validation/rating_scale.md); never converted to production tiers inside the dataset
  validator_code: V01
  rating_reference_policy: primary_playback_reference      # the validator hears the item's primary playback reference (same deterministic choice as collection) immediately before the learner recording
  pass2_fraction: 0.10
  blindness: validator sees target text, ids and audio only; no DTW/HMM/Cosine output exists before validation/ratings.csv is frozen (rating_tool.py freeze)
